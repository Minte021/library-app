<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>My Library</h1>
    <button id="new-book-btn">New Book</button>
    <div id="library-container"></div>

    <dialog id="book-dialog">
      <form id="book-form" novalidate>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required maxlength="100" />
        <span id="title-error" class="error-message"></span>
        <label for="author">Author</label>
        <input type="text" id="author" name="author" required />
        <span id="author-error" class="error-message"></span>
        <label for="pages">Pages</label>
        <input type="number" id="pages" name="pages" required />
        <span id="pages-error" class="error-message"></span>
        <label for="read">Have you read it?</label>
        <input type="checkbox" id="read" name="read" />


        <button type="submit">Add Book</button>
        <button type="button" id="cancel-btn">Cancel</button>
      </form>
    </dialog>

    <script type="module" src="./src/script.js"></script>
  </body>
</html>
